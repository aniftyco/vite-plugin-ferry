name: Publish Ferry

on:
  release:
    types: [published]
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # package.json stays 0.0.0 in the repo; this only sets the version in the
      # throwaway CI checkout, from the release tag (leading "v" stripped).
      - name: Set version from release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
